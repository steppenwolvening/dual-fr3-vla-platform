[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-fr3-vla-platform"
version = "0.2.0.dev1"
description = "Dual FR3 simulation, multimodal data and separate VLA research pipelines"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
fr3-platform = "fr3_platform.cli:main"
